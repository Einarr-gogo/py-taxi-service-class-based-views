{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  {% if driver_list %}
  	<ul class="list-group">
      {% for driver in driver_list %}
        <li class="list-group-item">
          <a href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.first_name }} {{ driver.last_name }}</a>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
