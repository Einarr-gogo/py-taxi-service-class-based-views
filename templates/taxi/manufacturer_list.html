{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer List</h1>
  {% if manufacturer_list %}
  	<ul class="list-group">
      {% for manufacturer in manufacturer_list %}
        <li class="list-group-item">
          Brand: {{ manufacturer.name }},
          Country: {{ manufacturer.country }}
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
