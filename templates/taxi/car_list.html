{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
  	<ul class="list-group">
      {% for car in car_list %}
        <li class="list-group-item">
          <a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
